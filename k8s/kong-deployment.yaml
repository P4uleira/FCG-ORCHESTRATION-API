apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      restartPolicy: Always

      initContainers:
        - name: wait-for-users-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z users-service 8080; do
                echo "Aguardando UsersAPI..."
                sleep 3
              done
        - name: wait-for-catalog-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z catalog-service 8081; do
                echo "Aguardando CatalogAPI..."
                sleep 3
              done

      containers:
        - name: kong
          image: kong:3.6
          imagePullPolicy: IfNotPresent

          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/kong/declarative/kong.yml"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"

          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
            - name: admin
              containerPort: 8001
              protocol: TCP

          volumeMounts:
            - name: kong-declarative-config
              mountPath: /kong/declarative/kong.yml
              subPath: kong.yml
              readOnly: true

      volumes:
        - name: kong-declarative-config
          secret:
            secretName: fcg-secret
            items:
              - key: kong.yml
                path: kong.yml