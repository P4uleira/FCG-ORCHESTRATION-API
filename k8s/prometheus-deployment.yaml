apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-for-users-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z users-service 8080; do
                echo "Aguardando UsersAPI..."
                sleep 3
              done
        - name: wait-for-catalog-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z catalog-service 8081; do
                echo "Aguardando CatalogAPI..."
                sleep 3
              done
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config